name: Snake eat GitHub Contributions

on:
  schedule:
    - cron: "0 */24 * * *" 
  workflow_dispatch:
  push:
    branches:
    - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake_output/github-contribution-grid-snake.svg
            snake_output/github-contribution-grid-snake-dark.svg?palette=github-dark
       
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: snake_output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
