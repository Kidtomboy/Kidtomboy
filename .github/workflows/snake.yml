name: Snake eat GitHub Contributions

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *" 
  
  # Allows to manually run the job at any time
  workflow_dispatch:
  
  # Run on every push on the master branch
  push:
    branches:
    - master
    
jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # 📌 Bước 1: Tạo file snake SVG từ biểu đồ đóng góp GitHub
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg  # 📁 Lưu file SVG với theme mặc định
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark  # 🌑 Lưu file SVG với theme tối

      # 📌 Bước 2: Push file snake SVG lên nhánh `output`
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output  # 🎯 Đẩy lên nhánh `output`
          build_dir: dist  # 📂 Chỉ push thư mục `dist`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
