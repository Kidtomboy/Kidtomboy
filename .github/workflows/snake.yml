name: Snake eat GitHub Contributions  # 📌 Tên của workflow

on:
  # 📅 Chạy tự động mỗi 24 giờ một lần
  schedule:
    - cron: "0 */24 * * *" 

  # 🎯 Cho phép chạy workflow thủ công bất cứ lúc nào từ GitHub Actions
  workflow_dispatch:

  # 🔄 Chạy workflow mỗi khi có push lên nhánh `master`
  push:
    branches:
      - master

jobs:
  generate:  # 🛠 Job "generate" để tạo file snake SVG
    permissions: 
      contents: write  # ✅ Cấp quyền ghi vào repo để push file lên nhánh `output`
    runs-on: ubuntu-latest  # 🚀 Chạy trên môi trường Ubuntu mới nhất
    timeout-minutes: 5  # ⏳ Giới hạn thời gian chạy tối đa là 5 phút

    steps:
      # 📌 Bước 1: Tạo file snake SVG từ biểu đồ đóng góp GitHub
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3  # 🛠 Sử dụng action Platane/snk để tạo ảnh rắn ăn đóng góp
        with:
          github_user_name: ${{ github.repository_owner }}  # 👤 Tên chủ repository
          outputs: |
            dist/github-contribution-grid-snake.svg  # 📁 Lưu file SVG với theme mặc định
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark  # 🌑 Lưu file SVG với theme tối

      # 📌 Bước 2: Push file snake SVG lên nhánh `output`
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0  # 🚀 Sử dụng action để đẩy file lên nhánh
        with:
          target_branch: output  # 🎯 Đẩy dữ liệu lên nhánh `output`
          build_dir: dist  # 📂 Chỉ push thư mục `dist`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 🔑 Token để cấp quyền push lên GitHub
