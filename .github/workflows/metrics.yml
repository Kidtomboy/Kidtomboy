name: Github metrics

on:
  # Run automatically at midnight every day
  schedule:
    - cron: "0 0 * * *" 

  # Allows to manually run the job at any time
  workflow_dispatch:

jobs:
  generate:
    permissions: 
      contents: write  # Grant write permission to push to the output branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generate github metrics SVG file
      - name: Generate github metrics SVG
        uses: lowlighter/metrics@latest
        with:
          filename: dist/metrics.svg  # Output file will be saved in the dist directory
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          plugin_wakatime: no
          plugin_achievements: no
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          user: kidtomboy
          template: classic
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 1000
          plugin_languages_sections: recently-used
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes
          commits_authoring: Kidtomboy
          base_indepth: yes
          base_hireable: yes
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member

      # Push the generated metrics.svg to the output branch
      - name: Push metrics.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output  # Specify the output branch
          build_dir: dist        # Specify the directory containing the metrics.svg file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
