name: Github metrics 🚀

on:
  # Run automatically at 0h10 every day
  schedule:
    - cron: "10 0 * * *"  # Run at 0h10 every day
  
  # Allows to manually run the job at any time
  workflow_dispatch:
  
  # Run on every push to the master branch
  push:
    branches:
    - master
    
jobs:
  generate:
    permissions: 
      contents: write # Grant repository content write permissions
    runs-on: ubuntu-latest # Run on the latest Ubuntu environment
    timeout-minutes: 5 # Set a maximum runtime of 5 minutes

    steps:
      - name: 📊 Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg  # Output file in the root directory
          token: ${{ secrets.METRICS_TOKEN }}  # API access token
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh  # Set timezone to Vietnam
  
          # Plugin configuration (disabled WakaTime and achievements for now)
          plugin_wakatime: no
          plugin_achievements: no
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          user: kidtomboy
          template: classic
  
          # Work calendar configuration
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
  
          # Programming languages configuration
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 1000
          plugin_languages_sections: recently-used
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes
  
          # Personal information configuration
          commits_authoring: Kidtomboy
          base_indepth: yes
          base_hireable: yes
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member

      # Push metrics.svg to the 'output2' branch
      - name: 📤 Push metrics.svg to the output2 branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output2  # Push to the output2 branch
          build_dir: .  # Root directory for the metrics.svg file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub authentication token
