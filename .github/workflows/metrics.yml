name: Github metrics

on:
  # Run manually or on a scheduled trigger
  schedule:
    - cron: "0 0 * * *" # Run every day at midnight
  
  # Allows to manually run the job at any time
  workflow_dispatch:
  
  # Run on every push on the master branch
  push:
    branches:
    - master
    
jobs:
  generate:
    permissions: 
      contents: write 
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 📌 Bước 1: Clone nhánh `output2` vào môi trường runner
      - name: Checkout output2 branch
        uses: actions/checkout@v4
        with:
          ref: output2  # 🎯 Clone nhánh `output2`
          fetch-depth: 0  # Tải toàn bộ lịch sử commit

      # 📌 Bước 2: Tạo file metrics.svg bằng action `lowlighter/metrics`
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg  # 📁 Lưu file vào thư mục gốc
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          plugin_wakatime: no
          plugin_achievements: no
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          user: kidtomboy
          template: classic
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 1000
          plugin_languages_sections: recently-used
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes
          commits_authoring: Kidtomboy
          base_indepth: yes
          base_hireable: yes
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member

      # 📌 Bước 3: Commit và đẩy file `metrics.svg` lên nhánh `output2`
      - name: Commit and push metrics.svg to the output2 branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add metrics.svg
          git commit -m "Update metrics.svg"
          git push origin output2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
