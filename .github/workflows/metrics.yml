name: Github metrics 🚀

on:
  # 📅 Run automatically on schedule or manually triggered
  schedule:
    - cron: "0 0 * * *" # ⏰ Run at midnight every day
  
  # 🛠️ Allow manual workflow execution
  workflow_dispatch:
  
  # 🔄 Run on every push to the master branch
  push:
    branches:
    - master
    
jobs:
  generate:
    permissions: 
      contents: write # 🔏 Grant repository content write permissions
    runs-on: ubuntu-latest # 🐧 Run on the latest Ubuntu environment
    timeout-minutes: 5 # ⏳ Set a maximum runtime of 5 minutes

    steps:
      - name: 📊 Generate metrics.svg # Step to generate the metrics.svg file
        uses: lowlighter/metrics@latest # ⚙️ Use the metrics action
        with:
          filename: metrics_output/metrics.svg # 📂 Output file path
          token: ${{ secrets.METRICS_TOKEN }} # 🔑 API access token
          base: header, activity, community, repositories, metadata # 📌 Core components
          config_timezone: Asia/Ho_Chi_Minh # 🌏 Set timezone
          
          # 🔧 Plugin configuration
          plugin_wakatime: no # 🚫 Disable WakaTime plugin
          plugin_achievements: no # 🚫 Hide achievements
          plugin_achievements_display: detailed # 🏆 Show detailed achievements
          plugin_achievements_secrets: yes # 🔒 Enable secret achievements display
          plugin_achievements_threshold: C # 🏅 Show achievements with a threshold of C or higher
          user: kidtomboy # 👤 GitHub username to fetch data from
          template: classic # 🎨 Display template
          
          # 📅 Work calendar configuration
          plugin_isocalendar: yes # 🗓️ Display work calendar
          plugin_isocalendar_duration: full-year # 🏁 Show the full-year calendar
          
          # 💻 Programming languages configuration
          plugin_languages: yes # 🌐 Display language chart
          plugin_languages_analysis_timeout: 15 # ⏳ Max language analysis time
          plugin_languages_analysis_timeout_repositories: 7.5 # ⏳ Repository analysis timeout
          plugin_languages_categories: markup, programming # 🔍 Show only programming & markup languages
          plugin_languages_colors: github # 🎨 Use GitHub color scheme
          plugin_languages_recent_categories: markup, programming # 📊 Recent language categories
          plugin_languages_recent_days: 365 # 📆 Analyze the last 365 days
          plugin_languages_recent_load: 1000 # 📜 Load up to 1000 recent repositories
          plugin_languages_sections: recently-used # 🛠️ Show recently used languages
          plugin_languages_threshold: 0% # 📏 Language display threshold
          plugin_languages_indepth: yes # 🔍 Show in-depth language details
          
          # 👤 Personal information configuration
          commits_authoring: Kidtomboy # ✍️ Commit author
          base_indepth: yes # 📌 Show detailed core information
          base_hireable: yes # 💼 Display hireable status
          repositories_forks: yes # 🔄 Show fork count
          repositories_affiliations: owner, collaborator, organization_member # 🏢 Show all relevant repositories

      # 🚀 Push metrics.svg to the 'output' branch
      - name: 📤 Push metrics.svg to the output branch # 📌 Step to push file to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0 # ⚙️ Use action to push file to GitHub Pages
        with:
          target_branch: output # 🔀 Destination branch for the file
          build_dir: . # 📂 Build directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 🔑 GitHub authentication token
