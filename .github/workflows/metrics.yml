name: Github metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: output2  # ✅ Check out branch `output2` thay vì `main`
          fetch-depth: 0  # 🛑 Đảm bảo lấy đầy đủ lịch sử commit tránh lỗi sync

      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg  # ✅ Lưu trực tiếp, KHÔNG vào thư mục `metrics_output`
          token: ${{ secrets.METRICS_TOKEN }}
          user: kidtomboy
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_categories: markup, programming
          plugin_languages_sections: recently-used
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 1000
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes
          commits_authoring: Kidtomboy
          base_indepth: yes
          base_hireable: yes
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member

      - name: Check generated files
        run: ls -lh || echo "⚠️ No output generated!"  # 🔍 Debug nếu file không được tạo

      - name: Commit & Push metrics.svg to output2
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add metrics.svg
          git commit -m "Update metrics.svg" || echo "No changes to commit"
          git push origin output2  # 🚀 Đẩy lên nhánh `output2`
