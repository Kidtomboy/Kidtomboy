name: Github metrics  # 📌 Tên của workflow

on:
  # 📅 Chạy tự động mỗi 24 giờ một lần vào lúc 00:00 (UTC)
  schedule:
    - cron: "0 0 * * *"

  # 🎯 Cho phép chạy workflow thủ công bất cứ lúc nào từ GitHub Actions
  workflow_dispatch:

  # 🔄 Chạy workflow mỗi khi có push lên nhánh `master`
  push:
    branches:
      - master

jobs:
  generate:  # 🛠 Job "generate" để tạo file metrics.svg
    permissions: 
      contents: write  # ✅ Cấp quyền ghi vào repo để push file lên nhánh `output`
    runs-on: ubuntu-latest  # 🚀 Chạy trên môi trường Ubuntu mới nhất
    timeout-minutes: 5  # ⏳ Giới hạn thời gian chạy tối đa là 5 phút

    steps:
      # 📌 Bước 1: Clone repo vào môi trường runner của GitHub Actions
      - name: Checkout repository
        uses: actions/checkout@v4  # 🛠 Sử dụng GitHub Action để tải mã nguồn của repo

      # 📌 Bước 2: Tạo file metrics.svg bằng action `lowlighter/metrics`
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          filename: metrics_output/metrics.svg  # 📁 Lưu file vào thư mục `metrics_output`
          token: ${{ secrets.METRICS_TOKEN }}  # 🔑 Sử dụng token từ GitHub Secrets để truy cập API

          # 👤 Định danh người dùng GitHub
          user: kidtomboy  # 🎯 Tên GitHub của bạn

          # 📊 Cấu hình nội dung của metrics
          base: header, activity, community, repositories, metadata  # 🏆 Hiển thị thông tin tổng quan
          config_timezone: Asia/Ho_Chi_Minh  # ⏰ Đặt múi giờ thành Việt Nam

          # 🚫 Tắt plugin WakaTime (chỉ bật nếu bạn dùng WakaTime)
          plugin_wakatime: no

          # 🏆 Kích hoạt plugin Achievements (thành tựu)
          plugin_achievements: yes
          plugin_achievements_display: detailed  # 📌 Hiển thị chi tiết
          plugin_achievements_secrets: yes  # 🔓 Hiển thị cả thành tựu bí mật
          plugin_achievements_threshold: C  # 🎖 Chỉ hiển thị thành tựu từ cấp độ C trở lên

          # 📅 Kích hoạt plugin lịch sử commit
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year  # 🗓 Hiển thị lịch sử commit 1 năm

          # 💻 Cấu hình plugin ngôn ngữ lập trình
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15  # ⏳ Thời gian phân tích tối đa 15s
          plugin_languages_analysis_timeout_repositories: 7.5  # ⏳ Giới hạn phân tích repo là 7.5s
          plugin_languages_categories: markup, programming  # 🎨 Chỉ lấy ngôn ngữ lập trình & markup
          plugin_languages_colors: github  # 🎨 Sử dụng bảng màu GitHub
          plugin_languages_recent_categories: markup, programming  # 🆕 Tương tự nhưng chỉ lấy ngôn ngữ gần đây
          plugin_languages_recent_days: 365  # 📆 Lấy dữ liệu trong 1 năm gần nhất
          plugin_languages_recent_load: 1000  # 🔍 Giới hạn số lượng repo cần phân tích
          plugin_languages_sections: recently-used  # 📌 Hiển thị ngôn ngữ sử dụng gần đây
          plugin_languages_threshold: 0%  # 📊 Không lọc ngôn ngữ theo mức độ sử dụng
          plugin_languages_indepth: yes  # 🔎 Phân tích chuyên sâu về ngôn ngữ lập trình

          # 🔧 Các tùy chọn khác
          commits_authoring: Kidtomboy  # ✍️ Tác giả commit
          base_indepth: yes  # 📖 Hiển thị dữ liệu chi tiết
          base_hireable: yes  # 🔎 Hiển thị trạng thái tuyển dụng
          repositories_forks: yes  # 🔄 Hiển thị cả repo fork
          repositories_affiliations: owner, collaborator, organization_member  # 🎭 Hiển thị repo sở hữu/cộng tác/thành viên

      # 📌 Bước 3: Push file `metrics.svg` lên nhánh `output`
      - name: Push metrics.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output  # 🚀 Đẩy dữ liệu lên nhánh `output`
          build_dir: metrics_output  # 📂 Chỉ push thư mục `metrics_output`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 🔑 Token để cấp quyền push lên GitHub
